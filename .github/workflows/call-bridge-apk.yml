name: Call Bridge Android APK
on:
  push:
    branches: [call-bridge-game]
    paths:
      - 'call-bridge/**'
      - '.github/workflows/call-bridge-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: call-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: call-bridge/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: call-bridge-debug-apk
          path: call-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
